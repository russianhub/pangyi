[workspace]
# 独立 crate，不参与 ime/ 的工作区；也避免 cargo 向上搜索到无关的 Cargo.toml。

[package]
name = "pangyi-updater"
# 必须与输入法版本号一致：发版时由 release workflow 按标签同步（见仓库 README）。
version = "4.18.0"
edition = "2021"

[dependencies]
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.22"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
