[package]
name = "pangyi_ime"
version = "4.21.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
panic = "abort"
opt-level = "z"

[features]
# 只有 setup.exe 打开。cargo build --lib 不带这个 feature，输入法 DLL 不会链进账号代码。
account = ["dep:pangyi_account"]

[dependencies]
windows = { version = "0.52", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_System_Com", "Win32_UI_TextServices", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Memory", "Win32_Security", "Win32_Security_Cryptography", "implement", "Win32_Graphics", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pangyi_account = { path = "../account", optional = true }

[[bin]]
name = "setup"
path = "src/bin/setup.rs"
required-features = ["account"]
