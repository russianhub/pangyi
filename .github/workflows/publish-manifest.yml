# 放在发布 Release 的仓库（pangyi 主仓库）。
# 你在 GitHub 上把草稿 Release 点「发布」之后触发：
# 下载安装包 → 计算哈希并签名 → 把安装包和 latest.json 推到网站仓库。
name: publish-update-manifest

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      SITE_REPO: russianhub/opensource-sites
      # 网站仓库的 GitHub Pages 从这个目录发布（见网站仓库 pages.yml）
      SITE_DIR: sites-plugin-sites-openai-curated-remote/work/life-spark/dist
    steps:
      - uses: actions/checkout@v4

      - name: Download installer from this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'pangyi-v*.exe' --dir dist
          ls -l dist
          test "$(ls dist/*.exe | wc -l)" -eq 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install cryptography

      - name: Make signed latest.json
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
          SIGN_KEY_PEM: ${{ secrets.PANGYI_SIGN_KEY }}
        run: |
          EXE=$(ls dist/*.exe)
          export EXE_PATH="$EXE"
          export MIRROR_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$EXE")"
          python tools/make_manifest.py latest.json
          cat latest.json

      - name: Check out website repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SITE_REPO }}
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: site

      - name: Update website files and push
        run: |
          VER="${TAG#v}"
          EXE=$(ls dist/*.exe)
          DEST="site/${SITE_DIR}/download"
          mkdir -p "$DEST"
          cp "$EXE" "$DEST/pangyi-v${VER}.exe"
          cp "$EXE" "$DEST/pangyi-latest.exe"
          cp latest.json "site/${SITE_DIR}/latest.json"
          # 只保留最新两个版本的安装包
          ls -1 "$DEST"/pangyi-v*.exe | sort -V | head -n -2 | xargs -r rm -f
          cd site
          git config user.name "pangyi-release-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "pangyi ${TAG}: update installer and latest.json" || echo "nothing to commit"
          git push
